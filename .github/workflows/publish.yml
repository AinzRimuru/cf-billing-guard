# Publish to npm via Trusted Publishing (OIDC) — no long-lived npm token needed.
#
# Trigger: publish a GitHub Release with tag vX.Y.Z (or X.Y.Z) matching package.json.
# Flow:    install → test → verify tag matches version → npm publish.
#          Provenance attestations are generated automatically when publishing
#          via trusted publishing from a public repository.
#
# One-time setup (npm requires the package to EXIST before you can configure
# a trusted publisher — unlike PyPI, there is no pre-registration):
#   1. Make the package exist first, either by
#      a) publishing v1.0.0 once from your machine (`npm login` + `npm publish`,
#         2FA OTP), or
#      b) publishing a placeholder with `npx setup-npm-trusted-publish
#         cf-billing-guard` (creates a clearly-marked 0.0.0), or
#      c) publishing once with a classic token workflow.
#   2. npmjs.com → package page → Settings → "Trusted Publisher" →
#      GitHub Actions → Organization or user: AinzRimuru, Repository:
#      cf-billing-guard, Workflow filename: publish.yml (exact match,
#      case-sensitive; environment optional).
#   3. Optional hardening: Settings → Publishing access →
#      "Require two-factor authentication and disallow tokens".
#      Then delete the NPM_TOKEN secret here and revoke the npm token.
#
# Requirements: npm CLI >= 11.5.1 (Node 24 bundles it), GitHub-hosted runners
# only, `repository.url` in package.json must match this repo exactly.
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token minting for trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # bundles npm >= 11.5.1, required for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          echo "package.json=$PKG_VERSION  release tag=$TAG"
          if [ "$TAG" != "v$PKG_VERSION" ] && [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION' (expected v$PKG_VERSION)"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm CLI detects the GitHub Actions OIDC environment
      # and exchanges the short-lived id-token for publish credentials.
      - name: Publish
        run: npm publish
