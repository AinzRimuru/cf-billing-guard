# Publish to npm automatically when a GitHub Release is published.
#
# Trigger: publish a Release with tag vX.Y.Z (or X.Y.Z) matching package.json.
# Flow:    install → test → verify tag matches version → npm publish --provenance.
#
# One-time setup:
#   1. npmjs.com → avatar → Access Tokens → Generate New Token
#      - Granular Access Token: Packages → Read and write. The package does
#        not exist before the first publish, so start with "All packages"
#        and narrow it to cf-billing-guard afterwards; or
#      - Classic Token → Automation type (bypasses 2FA, suits CI).
#   2. GitHub repo → Settings → Secrets and variables → Actions → New
#      repository secret: name NPM_TOKEN, value = the token above.
#
# If your token type does not support provenance, drop --provenance from the
# Publish step; everything else is unaffected.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance (build attestation via OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          echo "package.json=$PKG_VERSION  release tag=$TAG"
          if [ "$TAG" != "v$PKG_VERSION" ] && [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION' (expected v$PKG_VERSION)"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
